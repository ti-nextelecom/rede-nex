<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/images/logo_nex.png" />
    <link rel="apple-touch-icon" href="/assets/images/logo_nex.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Rede Nex, plataforma interna para comunicados, treinamentos, wiki, colaboradores e permissões."
    />
    <title>Rede Nex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <meta property="og:title" content="Rede Nex" />
    <meta
      property="og:description"
      content="Plataforma interna da Nex Telecom para comunicação, conhecimento e gestão de colaboradores."
    />
    <meta property="og:image" content="/assets/images/logo_nextelecom-pagina-inicial.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/assets/images/logo_nextelecom-pagina-inicial.png" />
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background: #020913;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 24px;
        transition: opacity 0.5s ease;
      }
      #splash.fade-out { opacity: 0; pointer-events: none; }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 16px rgba(232,71,25,0.8)) drop-shadow(0 0 40px rgba(232,71,25,0.4)); }
        50% { transform: scale(1.07); filter: drop-shadow(0 0 24px rgba(232,71,25,1)) drop-shadow(0 0 56px rgba(232,71,25,0.6)) drop-shadow(0 0 80px rgba(14,165,233,0.3)); }
      }
      @keyframes splash-dots {
        0%, 100% { opacity: 0.3; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      #splash img { width: 120px; height: 120px; object-fit: contain; animation: splash-pulse 2s ease-in-out infinite; }
      #splash-brand { font-family: "Arial Black", Impact, sans-serif; font-weight: 900; font-size: 32px; line-height: 1; letter-spacing: -0.01em; }
      #splash-brand .nex { color: #e84719; text-shadow: 0 0 16px rgba(232,71,25,0.85); }
      #splash-brand .tel { color: #dce8f8; text-shadow: 0 0 12px rgba(14,165,233,0.4); }
      #splash-dots { display: flex; gap: 8px; }
      #splash-dots span { width: 7px; height: 7px; border-radius: 50%; background: #e84719; animation: splash-dots 1.4s ease-in-out infinite; }
      #splash-dots span:nth-child(2) { animation-delay: 0.2s; background: #7c3aed; }
      #splash-dots span:nth-child(3) { animation-delay: 0.4s; background: #0ea5e9; }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/assets/images/logo_nex.png" alt="Rede Nex" />
      <div id="splash-brand"><span class="nex">NEX</span><span class="tel">TELECOM</span></div>
      <div id="splash-dots"><span></span><span></span><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
