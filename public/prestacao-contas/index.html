<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prestação de Contas — NexTelecom</title>
<script src="/prestacao-contas/chart.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b1120;--surface:#141d2e;--surface2:#1c2a3f;--surface3:#243249;
  --border:#1e3048;--border2:#2d4a6b;--text:#e2e8f0;--muted:#7a9bbf;
  --primary:#ff7a00;--primary-glow:#ff7a0040;
  --success:#22c55e;--danger:#ef4444;--warn:#f59e0b;
  --radius:12px;--radius-sm:8px;--font:'Inter',system-ui,sans-serif;
  --shadow:0 4px 24px #00000040;--shadow-sm:0 2px 8px #00000030;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── Layout ── */
#app{display:flex;flex-direction:column;min-height:100vh}

/* ── Header ── */
header{
  background:linear-gradient(180deg,#141d2e 0%,#0f1929 100%);
  border-bottom:1px solid var(--border);
  padding:0 28px;display:flex;align-items:center;gap:16px;
  height:58px;position:sticky;top:0;z-index:100;
  box-shadow:0 1px 0 var(--border),0 4px 16px #00000030;
}
header .logo{font-weight:800;font-size:16px;color:var(--text);white-space:nowrap;letter-spacing:-.3px}
header .logo span{color:var(--primary)}
header .logo .dot{color:var(--muted);font-weight:400;margin:0 2px}
header .sep-v{width:1px;height:20px;background:var(--border2);flex-shrink:0}
header .back-to-nex{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;color:var(--muted);border:1px solid var(--border2);flex-shrink:0;transition:color .15s,border-color .15s,background .15s}
header .back-to-nex:hover{color:var(--text);border-color:var(--primary);background:var(--surface2)}
header .breadcrumb{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);flex:1;overflow:hidden}
header .breadcrumb a{color:var(--muted);transition:color .15s}
header .breadcrumb a:hover{color:var(--text)}
header .breadcrumb .sep{opacity:.35;font-size:11px;margin:0 1px}
header .breadcrumb .current{color:var(--text);font-weight:500}
header .user-pill{
  background:var(--surface2);border:1px solid var(--border2);border-radius:20px;
  padding:4px 12px 4px 6px;display:flex;align-items:center;gap:8px;
  font-size:12.5px;white-space:nowrap;transition:border-color .15s;
}
header .user-pill:hover{border-color:var(--primary)}
header .user-pill .avatar{
  width:26px;height:26px;border-radius:50%;
  background:linear-gradient(135deg,#3b82f6,#7c3aed);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;flex-shrink:0;
}

/* ── Main ── */
main{flex:1;padding:28px;max-width:1280px;width:100%;margin:0 auto}

/* ── Summary Strip ── */
.summary-strip{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:12px;margin-bottom:28px;
}
.summary-kpi{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;position:relative;overflow:hidden;
  animation:fadeUp .4s ease both;
}
.summary-kpi::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  background:var(--kpi-color,var(--primary));border-radius:0 0 var(--radius) var(--radius);
}
.summary-kpi-label{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.summary-kpi-value{font-size:20px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.1}
.summary-kpi-sub{font-size:11px;color:var(--muted);margin-top:4px}

/* ── Page Header ── */
.page-hd{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:24px;gap:16px;flex-wrap:wrap;
}
.page-hd-left h1{font-size:22px;font-weight:800;letter-spacing:-.4px;line-height:1.2}
.page-hd-left .subtitle{font-size:13px;color:var(--muted);margin-top:3px}
.page-hd .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ── Buttons ── */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 16px;
  border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;
  border:none;transition:all .15s;letter-spacing:-.1px;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 2px 8px #ff7a0040}
.btn-primary:hover{background:#2563eb;box-shadow:0 4px 16px #3b82f660}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border2)}
.btn-ghost:hover{color:var(--text);border-color:var(--muted);background:var(--surface2)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-success{background:var(--success);color:#fff}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-bi{background:linear-gradient(135deg,#1d4ed8,#7c3aed);color:#fff;box-shadow:0 2px 12px #7c3aed33}
.btn-bi:hover{box-shadow:0 4px 20px #7c3aed55;opacity:.95}

/* ── Setor Cards ── */
.setores-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;
}
.setor-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:0;cursor:pointer;overflow:hidden;position:relative;
  transition:border-color .2s,box-shadow .2s,transform .2s;
  animation:fadeUp .35s ease both;
}
.setor-card:hover{
  border-color:var(--card-accent,var(--primary));
  box-shadow:0 0 0 1px var(--card-accent,var(--primary))44,0 8px 32px #00000050;
  transform:translateY(-2px);
}
.setor-card-accent-bar{
  height:3px;background:var(--card-accent,var(--primary));
  position:absolute;top:0;left:0;right:0;
}
.setor-card-body{padding:20px 22px 0}
.setor-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.setor-card-icon{
  width:40px;height:40px;border-radius:10px;flex-shrink:0;
  background:var(--card-accent-bg,#1d4ed820);
  border:1px solid var(--card-accent,var(--primary))33;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
}
.setor-card-meta{text-align:right}
.setor-card-tag{
  background:var(--surface2);border:1px solid var(--border2);border-radius:6px;
  padding:3px 8px;font-size:11px;color:var(--muted);font-family:monospace;letter-spacing:.05em;
}
.setor-card-name{font-size:17px;font-weight:700;margin-bottom:4px;letter-spacing:-.3px}
.setor-card-resp{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.setor-card-amount-row{margin-bottom:16px}
.setor-card-amount{
  font-size:28px;font-weight:800;letter-spacing:-.5px;
  color:var(--card-accent,var(--primary));font-variant-numeric:tabular-nums;line-height:1.1;
}
.setor-card-amount-label{font-size:11px;color:var(--muted);margin-top:3px}
.setor-card-foot{
  display:flex;gap:0;border-top:1px solid var(--border);
  margin:0 -22px;padding:10px 22px;
}
.setor-card-stat{flex:1;display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center}
.setor-card-stat+.setor-card-stat{border-left:1px solid var(--border);padding-left:12px;margin-left:12px}
.setor-card-stat-val{font-size:14px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.setor-card-stat-lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.setor-card-arrow{
  position:absolute;right:18px;bottom:14px;color:var(--muted);font-size:16px;
  opacity:0;transition:opacity .15s,transform .15s;
}
.setor-card:hover .setor-card-arrow{opacity:1;transform:translateX(3px)}

/* ── Empty State ── */
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:80px 20px;text-align:center;
}
.empty-state .empty-icon{font-size:48px;margin-bottom:16px;opacity:.6}
.empty-state h3{font-size:18px;font-weight:700;margin-bottom:8px}
.empty-state p{color:var(--muted);font-size:14px;max-width:340px;line-height:1.5}
.empty-state .empty-action{margin-top:24px}

/* ── Table ── */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
th{
  background:var(--surface2);padding:11px 16px;text-align:left;
  font-weight:600;font-size:11px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;
}
td{padding:12px 16px;border-top:1px solid var(--border);vertical-align:middle}
tr:hover td{background:var(--surface2)}
.amount{font-variant-numeric:tabular-nums;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:600}
.pill-blue{background:#1d4ed820;color:#60a5fa;border:1px solid #1d4ed840}
.pill-green{background:#15803d20;color:#4ade80;border:1px solid #15803d40}
.pill-yellow{background:#92400e20;color:#fcd34d;border:1px solid #92400e40}
.pill-red{background:#7f1d1d20;color:#fca5a5;border:1px solid #7f1d1d40}

/* ── Drawer ── */
.drawer-overlay{position:fixed;inset:0;background:#00000080;z-index:200;display:none;backdrop-filter:blur(2px)}
.drawer-overlay.open{display:block}
.drawer{
  position:fixed;right:0;top:0;bottom:0;width:min(600px,100vw);
  background:var(--surface);border-left:1px solid var(--border);z-index:201;
  display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);
  box-shadow:-8px 0 32px #00000040;
}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.drawer-head h3{flex:1;font-weight:700;font-size:15px}
.drawer-body{flex:1;overflow-y:auto;padding:22px}
.drawer-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}

/* ── Form ── */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
label{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input,select,textarea{
  background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);
  padding:9px 11px;color:var(--text);font-size:13px;font-family:inherit;width:100%;
  transition:border-color .15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}
textarea{resize:vertical;min-height:80px}
input[type=file]{padding:6px;cursor:pointer}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:#00000090;z-index:300;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal{
  background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);
  width:100%;max-width:520px;padding:28px;box-shadow:var(--shadow);
  animation:fadeUp .2s ease;
}
.modal h3{font-size:17px;font-weight:800;margin-bottom:20px;letter-spacing:-.3px}
.modal-foot{margin-top:24px;display:flex;justify-content:flex-end;gap:8px}

/* ── Fatura ── */
.fatura-header{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);padding:28px;margin-bottom:24px}
.fatura-header .bank-name{font-size:26px;font-weight:800;color:var(--primary);margin-bottom:4px;letter-spacing:-.5px}
.fatura-header .card-info{font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.6}
.fatura-header .totals{display:flex;gap:32px;flex-wrap:wrap}
.fatura-header .total-item{display:flex;flex-direction:column;gap:3px}
.fatura-header .total-item .lbl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fatura-header .total-item .val{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}

/* ── Misc ── */
.section-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.chip{
  background:var(--surface2);border:1px solid var(--border2);border-radius:6px;
  padding:3px 9px;font-size:11px;display:inline-flex;align-items:center;gap:4px;
}
.spinner{
  width:34px;height:34px;border:3px solid var(--border2);border-top-color:var(--primary);
  border-radius:50%;animation:spin .7s linear infinite;margin:48px auto;display:block;
}
.toast{
  position:fixed;bottom:24px;right:24px;
  background:var(--surface3);border:1px solid var(--border2);border-radius:var(--radius-sm);
  padding:11px 18px;font-size:13px;z-index:9999;animation:fadeIn .2s ease;
  box-shadow:var(--shadow);
}
.comment-item{background:var(--surface2);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;border:1px solid var(--border)}
.comment-meta{font-size:11px;color:var(--muted);margin-bottom:5px}
.anexo-item{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--surface2);border-radius:var(--radius-sm);padding:9px 13px;
  margin-bottom:6px;border:1px solid var(--border);
}
.anexo-name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;
  cursor:pointer;margin-bottom:20px;padding:6px 10px 6px 6px;
  border-radius:6px;transition:all .15s;
}
.back-btn:hover{color:var(--text);background:var(--surface2)}

/* ── Períodos table improvements ── */
.periodo-row-open td{border-left:3px solid var(--success)}
.periodo-row-closed td{border-left:3px solid transparent}

/* ── BI Dashboard ── */
.bi-kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px;margin-bottom:24px}
.bi-kpi{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px 22px;position:relative;overflow:hidden;
  animation:fadeUp .35s ease both;
}
.bi-kpi::before{
  content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(135deg,var(--kpi-accent,#3b82f6)22,transparent 70%);
  opacity:.05;pointer-events:none;
}
.bi-kpi::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  background:var(--kpi-accent,var(--primary));
}
.bi-kpi-label{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.bi-kpi-value{font-size:22px;font-weight:800;color:var(--text);margin-bottom:4px;font-variant-numeric:tabular-nums;line-height:1.1}
.bi-kpi-sub{font-size:11px;color:var(--muted)}
.bi-grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-bottom:16px}
.bi-chart-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;
  animation:fadeUp .4s ease both;
}
.bi-chart-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:18px;display:flex;align-items:center;gap:8px}
.bi-chart-title .badge{
  font-size:10px;font-weight:600;background:var(--surface2);border:1px solid var(--border2);
  border-radius:4px;padding:2px 7px;color:var(--muted);
}
.bi-chart-wrap{position:relative;height:240px}
.bi-chart-wrap.tall{height:300px}
.bi-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:80px 0;color:var(--muted);font-size:13px}
.bi-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.bi-filters label{font-size:12px;font-weight:600;color:var(--muted)}
.bi-filters select{
  background:var(--surface2);border:1px solid var(--border2);border-radius:6px;
  padding:5px 10px;color:var(--text);font-size:12px;cursor:pointer;min-width:140px;
}
.bi-insight{
  background:var(--surface2);border-left:3px solid var(--primary);
  border-radius:0 6px 6px 0;padding:11px 15px;font-size:12px;color:var(--muted);margin-top:12px;
}
.bi-insight strong{color:var(--text)}
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="back-to-nex" href="https://rede.nextelecom.net.br/" title="Voltar para Rede Nex">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="breadcrumb" id="breadcrumb"></div>
    <button class="btn btn-bi btn-sm" id="bi-btn" onclick="showBI()" style="display:none;white-space:nowrap;gap:5px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      Analytics
    </button>
    <div class="user-pill" id="user-pill" style="display:none">
      <div class="avatar" id="user-avatar"></div>
      <span id="user-name"></span>
    </div>
  </header>
  <main id="main-area">
    <div class="spinner" id="spinner"></div>
  </main>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>

<div class="drawer-overlay" id="drawer-overlay">
  <div class="drawer" id="drawer">
    <div class="drawer-head">
      <h3 id="drawer-title">Lançamento</h3>
      <button class="btn btn-ghost btn-sm" onclick="closeDrawer()">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
    <div class="drawer-foot" id="drawer-foot"></div>
  </div>
</div>

<script>
const API = 'https://rede.nextelecom.net.br/api';
let me = null;
let currentSetor = null, currentPeriodo = null, currentLancamento = null;

const fmt = v => 'R$ ' + Number(v).toLocaleString('pt-BR', {minimumFractionDigits:2});
const fmtShort = v => {
  const n = Number(v);
  if (n >= 1000000) return 'R$ ' + (n/1000000).toFixed(1).replace('.',',') + 'M';
  if (n >= 1000) return 'R$ ' + (n/1000).toFixed(1).replace('.',',') + 'k';
  return fmt(v);
};
const fmtDate = s => {
  if (!s) return '—';
  const d = new Date(String(s).slice(0,10)+'T12:00:00');
  return isNaN(d) ? '—' : d.toLocaleDateString('pt-BR');
};
const toast = (msg, t=3000) => {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), t);
};

const SETOR_ICONS = ['🏢','💼','🖥️','📦','🔧','📊','🏗️','🎯','💡','🌐'];
const SETOR_COLORS = ['#3b82f6','#22c55e','#f59e0b','#8b5cf6','#06b6d4','#f97316','#ec4899','#14b8a6','#84cc16','#ef4444'];

async function api(method, path, body) {
  const opts = { method, credentials: 'include', headers: { 'Content-Type':'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    throw new Error(err.error?.message || `HTTP ${r.status}`);
  }
  if (r.status === 204) return null;
  return r.json();
}

function setBreadcrumb(items) {
  document.getElementById('breadcrumb').innerHTML = items.map((it,i) => {
    const isLast = i === items.length - 1;
    const sep = i > 0 ? '<span class="sep">›</span>' : '';
    if (isLast) return `${sep}<span class="current">${it.label}</span>`;
    if (it.link) return `${sep}<a href="#" onclick="${it.link};return false">${it.label}</a>`;
    return `${sep}<span>${it.label}</span>`;
  }).join('');
}

// ── AUTH ──────────────────────────────────────────────────
async function init() {
  try {
    const r = await api('GET', '/auth/me');
    me = r.data;
    document.getElementById('user-pill').style.display = 'flex';

function openNovoLancamento() {

      <div class="form-group full"><label>Descrição do Gasto *</label><input id="l-desc" placeholder="Descrição detalhada" /></div>
      <div class="form-group"><label>Nº Documento (NF/Recibo)</label><input id="l-doc" placeholder="Número" /></div>

          <span style="font-size:13px">Sim, foi parcelado</span>
        </label>
      </div>
      <div class="form-group" id="l-parcelas-group" style="display:none"><label>Nº de Parcelas</label><input id="l-parcelas" type="number" min="2" max="48" placeholder="Ex: 3" /></div>
      <div class="form-group"><label>Setor/Área Usuária</label><input id="l-setor" value="${currentSetor.nome}" /></div>
      <div class="form-group full"><label>Observações</label><textarea id="l-obs" rows="2"></textarea></div>
      <div class="form-group full"><label>Anexo (opcional)</label>
        <label class="btn btn-ghost btn-sm" style="cursor:pointer;display:inline-flex;align-items:center;gap:6px;width:auto">
          📎 Selecionar arquivo
          <input type="file" id="l-file" style="display:none" multiple onchange="document.getElementById('l-file-name').textContent=Array.from(this.files).map(f=>f.name).join(', ')" />
        </label>
        <span id="l-file-name" style="font-size:12px;color:var(--muted);margin-left:8px"></span>

async function salvarLancamento(addOutro) {
  const dataLanc = document.getElementById('l-data').value;
  const descricao = document.getElementById('l-desc').value.trim();
  const valor = parseFloat(document.getElementById('l-valor').value);
  if (!dataLanc||!descricao||isNaN(valor)||valor<=0) { toast('Preencha Data, Descrição e Valor'); return; }
  const parcelado = document.getElementById('l-parcelado')?.checked || false;
  const num_parcelas = parcelado ? (parseInt(document.getElementById('l-parcelas')?.value)||null) : null;
  try {
    const r = await api('POST', '/pc/lancamentos', {
      periodo_id: currentPeriodo.id,
      data: dataLanc,
      data_compra: document.getElementById('l-compra')?.value || null,
      descricao, valor,
      fornecedor: document.getElementById('l-forn').value.trim()||null,
      numero_documento: document.getElementById('l-doc').value.trim()||null,
      forma_pagamento: currentSetor.card_last4 ? 'Cartão de Crédito KAMINO' : null,
      parcelado, num_parcelas,
      setor_area: document.getElementById('l-setor').value.trim()||null,
      observacoes: document.getElementById('l-obs').value.trim()||null,
    });
    const lancId = r.data.id;
    const files = document.getElementById('l-file')?.files;
    if (files && files.length) {
      for (const file of files) {
        try {
          const fileData = await new Promise((res, rej) => {
            const fr = new FileReader(); fr.onload = e => res(e.target.result); fr.onerror = rej; fr.readAsDataURL(file);
          });
          await api('POST', `/pc/lancamentos/${lancId}/anexos`, { file_name: file.name, file_type: file.type, data: fileData });
        } catch(fe) { toast(`Erro ao enviar ${file.name}: ${fe.message}`); }
      }
    }
    toast('Lançamento adicionado!');
    if (addOutro) { openNovoLancamento(); } else { closeModal(); }
    await showLancamentos(currentPeriodo.id, currentPeriodo.periodo);
  } catch(e) { toast(e.message); }
}

async function openDrawerLancamento(lancId) {
  document.getElementById('drawer-overlay').classList.add('open');

function renderAnexos(anexos, lancId) {
  const el = document.getElementById('anexos-list');
  if (!el) return;
  if (!anexos.length) { el.innerHTML = '<div style="font-size:12px;color:var(--muted);margin-bottom:4px">Nenhum anexo.</div>'; return; }
  el.innerHTML = '';
  anexos.forEach(a => {
    const div = document.createElement('div');
    div.className = 'anexo-item';
    div.innerHTML = `
      <div class="anexo-name">📎 ${a.nome_original}</div>
      <div style="display:flex;gap:6px">
        <a class="btn btn-ghost btn-sm" href="${API}/pc/anexos/${a.id}" target="_blank">Baixar</a>
        <button class="btn btn-danger btn-sm" onclick="excluirAnexo('${a.id}','${lancId}')">✕</button>
      </div>`;
    el.appendChild(div);
  });
}

function renderComentarios(comentarios) {
  const el = document.getElementById('comentarios-list');
  if (!el) return;
  if (!comentarios.length) { el.innerHTML = '<div style="font-size:12px;color:var(--muted);margin-bottom:4px">Nenhum comentário.</div>'; return; }
  el.innerHTML = '';
  comentarios.forEach(c => {
    const div = document.createElement('div');
    div.className = 'comment-item';
    div.innerHTML = `
      <div class="comment-meta">${c.autor_nome||'Usuário'} · ${new Date(c.created_at).toLocaleString('pt-BR')}</div>
      <div>${c.texto}</div>`;
    el.appendChild(div);
  });
}

async function uploadAnexo(lancId) {
  const files = document.getElementById('file-input').files;
  if (!files.length) return;
  for (const file of files) {
    try {
      const data = await new Promise((res, rej) => {
        const r = new FileReader(); r.onload = e => res(e.target.result); r.onerror = rej; r.readAsDataURL(file);
      });
      await api('POST', `/pc/lancamentos/${lancId}/anexos`, { file_name: file.name, file_type: file.type, data });
      toast(`${file.name} enviado!`);
    } catch(e) { toast(e.message); }
  }
  const anexR = await api('GET', `/pc/lancamentos/${lancId}/anexos`);
  renderAnexos(anexR.data, lancId);
}

async function excluirAnexo(id, lancId) {
  if (!confirm('Remover este anexo?')) return;
  try { await api('DELETE', `/pc/anexos/${id}`); toast('Anexo removido.'); const r = await api('GET', `/pc/lancamentos/${lancId}/anexos`); renderAnexos(r.data, lancId); }
  catch(e) { toast(e.message); }
}

async function enviarComentario(lancId) {
  const texto = document.getElementById('novo-comentario').value.trim();
  if (!texto) return;
  try {
    await api('POST', `/pc/lancamentos/${lancId}/comentarios`, { texto });
    document.getElementById('novo-comentario').value = '';
    const r = await api('GET', `/pc/lancamentos/${lancId}/comentarios`);
    renderComentarios(r.data);
    toast('Comentário adicionado.');
  } catch(e) { toast(e.message); }
}

async function salvarEditLancamento(id) {
  const data = document.getElementById('el-data').value;
  const descricao = document.getElementById('el-desc').value.trim();
  const valor = parseFloat(document.getElementById('el-valor').value);
  if (!data||!descricao||isNaN(valor)||valor<=0) { toast('Preencha campos obrigatórios'); return; }
  const parcelado = document.getElementById('el-parcelado')?.checked || false;
  const num_parcelas = parcelado ? (parseInt(document.getElementById('el-parcelas')?.value)||null) : null;
  const data_compra = document.getElementById('el-compra')?.value || null;
  const prev = currentLancamento;
  try {
    await api('PUT', `/pc/lancamentos/${id}`, {
      data, data_compra, descricao, valor,
      fornecedor: document.getElementById('el-forn').value.trim()||null,
      numero_documento: document.getElementById('el-doc').value.trim()||null,
      forma_pagamento: prev.forma_pagamento || null,
      parcelado, num_parcelas,
      setor_area: document.getElementById('el-setor').value.trim()||null,
      observacoes: document.getElementById('el-obs').value.trim()||null,
    });
    const changes = [];
    if (prev.descricao !== descricao) changes.push(`Descrição: "${prev.descricao}" → "${descricao}"`);
    if (parseFloat(prev.valor) !== valor) changes.push(`Valor: ${fmt(prev.valor)} → ${fmt(valor)}`);
    if ((prev.data?.slice(0,10)||'') !== data) changes.push(`Data lançamento: ${fmtDate(prev.data)} → ${fmtDate(data)}`);
    if ((prev.data_compra?.slice(0,10)||'') !== (data_compra||'')) changes.push(`Data compra: ${fmtDate(prev.data_compra)} → ${fmtDate(data_compra)}`);
    if ((prev.fornecedor||'') !== (document.getElementById('el-forn').value.trim()||'')) changes.push(`Fornecedor: "${prev.fornecedor||'—'}" → "${document.getElementById('el-forn').value.trim()||'—'}"`);
    if (!!prev.parcelado !== parcelado) changes.push(`Parcelado: ${prev.parcelado?'Sim':'Não'} → ${parcelado?'Sim':'Não'}`);
    if ((prev.num_parcelas||null) !== num_parcelas) changes.push(`Parcelas: ${prev.num_parcelas||'—'} → ${num_parcelas||'—'}`);
    const logText = `✏️ Editado em ${new Date().toLocaleString('pt-BR')}${changes.length ? ': ' + changes.join(' | ') : ''}`;
    await api('POST', `/pc/lancamentos/${id}/comentarios`, { texto: logText });
    closeModal(); toast('Lançamento atualizado!');
    await openDrawerLancamento(id);
    await showLancamentos(currentPeriodo.id, currentPeriodo.periodo);
  } catch(e) { toast(e.message); }
}

    const allPeriodos = periodosPorSetor.flat();
    const lancPorPeriodo = await Promise.all(
      allPeriodos.map(p => api('GET', `/pc/periodos/${p.id}/lancamentos`).then(r =>

      </div>
      <div class="bi-chart-card" style="animation-delay:.15s">
        <div class="bi-chart-title">Forma de Pagamento <span class="badge">${formaEntries.length}</span></div>
        <div class="bi-chart-wrap"><canvas id="chart-forma"></canvas></div>
      </div>
    </div>

    <div class="bi-chart-card" style="margin-bottom:16px;animation-delay:.2s">
      <div class="bi-chart-title">Evolução de Gastos por Mês <span class="badge">${mesSorted.length} mes${mesSorted.length!==1?'es':''}</span></div>
      <div class="bi-chart-wrap tall"><canvas id="chart-mes"></canvas></div>
    </div>

    <div class="bi-grid-2" style="margin-bottom:16px">
      <div class="bi-chart-card" style="animation-delay:.25s">
        <div class="bi-chart-title">Top Fornecedores <span class="badge">top ${topForn.length}</span></div>
        <div class="bi-chart-wrap" style="height:${Math.max(200,topForn.length*38)}px"><canvas id="chart-forn"></canvas></div>
      </div>
      <div class="bi-chart-card" style="animation-delay:.3s">
        <div class="bi-chart-title">Gastos por Período <span class="badge">${periodosSorted.length}</span></div>
        <div class="bi-chart-wrap" style="height:${Math.max(200,periodosSorted.length*38)}px"><canvas id="chart-periodo"></canvas></div>
      </div>
    </div>

    ${lancamentos.length===0?'<div class="empty" style="margin-top:20px">Nenhum lançamento encontrado. Adicione dados para visualizar os gráficos.</div>':''}`;

  if (!lancamentos.length) return;

  Chart.defaults.color = '#7a9bbf';
  Chart.defaults.borderColor = '#1e3048';
  Chart.defaults.font.family = "'Inter',system-ui,sans-serif";
  Chart.defaults.font.size = 12;

  const ttFmt  = { callbacks: { label: c => fmt(c.raw) } };
  const ttFmtH = { callbacks: { label: c => fmt(c.parsed.x) } };
  const xMoney = { ticks: { callback: v => v>=1000?'R$'+(v/1000).toFixed(0)+'k':fmt(v), color:'#7a9bbf' }, grid:{color:'#1e3048'} };

  if (setorEntries.length) mkChart('chart-setor', {
    type:'bar',
    data:{ labels:setorEntries.map(([k])=>k), datasets:[{ label:'Total', data:setorEntries.map(([,v])=>v), backgroundColor:BI_COLORS.slice(0,setorEntries.length).map(c=>c+'bb'), borderColor:BI_COLORS.slice(0,setorEntries.length), borderWidth:1, borderRadius:5 }] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false},tooltip:ttFmtH}, scales:{x:xMoney,y:{grid:{color:'#1e3048'},ticks:{color:'#7a9bbf'}}} }
  });

  if (formaEntries.length) mkChart('chart-forma', {
    type:'doughnut',
    data:{ labels:formaEntries.map(([k])=>k), datasets:[{ data:formaEntries.map(([,v])=>v), backgroundColor:BI_COLORS.map(c=>c+'cc'), borderColor:'#141d2e', borderWidth:3, hoverOffset:8 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{position:'right',labels:{boxWidth:12,padding:12,color:'#7a9bbf'}}, tooltip:ttFmt }, cutout:'62%' }
  });

  if (mesSorted.length) mkChart('chart-mes', {
    type:'line',
    data:{ labels:mesSorted.map(mesLabel), datasets:[{ label:'Gastos', data:mesSorted.map(([,v])=>v), borderColor:'#3b82f6', backgroundColor:'#3b82f610', fill:true, tension:0.4, pointRadius:5, pointHoverRadius:8, pointBackgroundColor:'#3b82f6', pointBorderColor:'#141d2e', pointBorderWidth:2 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false},tooltip:ttFmt}, scales:{y:{...xMoney},x:{grid:{color:'#1e3048'},ticks:{color:'#7a9bbf'}}} }
  });

  if (topForn.length) mkChart('chart-forn', {
    type:'bar',
    data:{ labels:topForn.map(([k])=>k), datasets:[{ label:'Total', data:topForn.map(([,v])=>v), backgroundColor:'#22c55e44', borderColor:'#22c55e', borderWidth:1, borderRadius:4 }] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false},tooltip:ttFmtH}, scales:{x:xMoney,y:{grid:{color:'#1e3048'},ticks:{color:'#7a9bbf'}}} }
  });

  if (periodosSorted.length) mkChart('chart-periodo', {
    type:'bar',
    data:{ labels:periLabels, datasets:[{ label:'Total', data:periodosSorted.map(p=>parseFloat(p.total_gasto||0)), backgroundColor:BI_COLORS.map((c,i)=>BI_COLORS[i%BI_COLORS.length]+'66'), borderColor:BI_COLORS.map((c,i)=>BI_COLORS[i%BI_COLORS.length]), borderWidth:1, borderRadius:4 }] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false},tooltip:ttFmtH}, scales:{x:xMoney,y:{grid:{color:'#1e3048'},ticks:{color:'#7a9bbf'}}} }
  });
}

init();
</script>
</body>
</html>
